services:
  # Backend API
  - type: web
    name: ad-generator-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend as Web Service (Node)
  - type: web
    name: ad-generator-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve dist --listen $PORT
    envVars:
      - key: VITE_API_URL
        sync: false
