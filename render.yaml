services:
  # Backend API
  - type: web
    name: ad-generator-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false   # You'll set this in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend
  - type: web
    name: ad-generator-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ad-generator-api
          type: web
          property: host
